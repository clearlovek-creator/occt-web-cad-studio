name: Modeling Agent

on:
  push:
    paths:
      - "web-cad-agent/**"
      - ".github/workflows/modeling-agent.yml"
  pull_request:
    paths:
      - "web-cad-agent/**"
      - ".github/workflows/modeling-agent.yml"
  workflow_dispatch:

concurrency:
  group: modeling-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web CAD Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-cad-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web-cad-agent/pyproject.toml
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src migrations
      - name: Run unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Check migration graph
        env:
          PYTHONPATH: src
        run: python -m alembic heads
      - name: Run migration upgrade and downgrade smoke test
        env:
          PYTHONPATH: src
          WEBCAD_AGENT_DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -c "from pathlib import Path; Path('ci-migration.db').unlink(missing_ok=True)"
