[project]
name = "modeling-agent"
version = "0.1.0"
description = "Stateful modeling agent harness for the OCCT Web CAD demo."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "langchain-core>=0.3,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "hypothesis>=6.120,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.12"
strict = true
