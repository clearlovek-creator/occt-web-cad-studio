[project]
name = "webcad-agent"
version = "0.1.0"
description = "Independent Python CLI/TUI Agent runtime for the OCCT Web CAD Gateway."
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "textual>=0.80,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.15,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
agent = [
  "langgraph>=1,<2",
  "openai>=1.60,<2",
]
telemetry = [
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "hypothesis>=6.120,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
webcad-agent = "webcad_agent.cli:main"

[project.entry-points."webcad_agent.tools"]
core = "webcad_agent.extensions.builtin:provide_tools"

[project.entry-points."webcad_agent.skills"]
core = "webcad_agent.extensions.builtin:provide_skills"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webcad_agent = ["assets/**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
